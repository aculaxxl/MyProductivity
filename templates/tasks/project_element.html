<a href="{% url 'tasks:project-detail' project.id %}" 
   class="list-group-item list-group-item-action d-flex justify-content-between align-items-center mb-3 shadow-sm p-8 bg-white rounded border-start border-primary border-2">
    <div>
        <i class="bi bi-folder2-open text-primary me-2"></i>
        <span class="fw-bold h5 mb-0 text-dark">{{ project.name }}</span>
    </div>
    <span class="badge bg-primary rounded-pill px-3">{{ project.tasks.count }} tasks</span>
</a>
