<a href="{% url 'tasks:project-detail' project.id %}" 
   class="task-row d-flex justify-content-between align-items-center bg-white border-bottom px-4">
    <div>
        <i class="bi bi-stack text-primary me-2"></i>
        <span class="fw-bold h5 mb-0 text-dark">{{ project.name }}</span>
    </div>
    <span class="badge bg-primary rounded-pill px-3 shadow-sm">
        <i class="bi bi-list-nested me-1"></i> 
        {{ project.total_tasks_count }} tasks / 
        <i class="bi bi-clock-history ms-2 me-1"></i> 
        {{ project.active_tasks_count }} active
    </span>
</a>
