<div id="task-{{ task.id }}" class="list-group-item p-3 border-warning border-start border-4 shadow-sm mb-2 bg-white rounded">
    <form hx-post="{% url 'tasks:task-edit' task.id %}" 
          hx-target="#task-{{ task.id }}" 
          hx-swap="outerHTML" 
          class="row g-2 align-items-center">
        {% csrf_token %}
        <div class="col-md-5">{{ form.name }}</div>
        <div class="col-md-3">{{ form.deadline }}</div>
        <div class="col-md-2">{{ form.priority }}</div>
        <div class="col-md-2 d-flex gap-1">
            <button type="submit" class="btn btn-success btn-sm w-100">
                <i class="bi bi-check-lg"></i>
            </button>
            <button hx-get="{% url 'tasks:task-toggle' task.id %}" 
                    hx-target="#task-{{ task.id }}" 
                    hx-swap="outerHTML" 
                    type="button"
                    class="btn btn-outline-secondary btn-sm w-100">
                <i class="bi bi-x-lg"></i>
            </button>
        </div>
    </form>
</div>
