<div id="task-{{ task.id }}" 
     class="list-group-item d-flex justify-content-between align-items-center mb-2 shadow-sm border-start border-4 
            {% if task.is_done %}bg-light opacity-75{% endif %}
            {% if task.priority == 3 %}border-danger{% elif task.priority == 2 %}border-warning{% else %}border-info{% endif %}">
    <input type="hidden" name="task" value="{{ task.id }}">
    <div class="d-flex align-items-center">
        <i class="bi bi-grip-vertical text-muted me-2 drag-handle" style="cursor: grab;"></i>
        <input class="form-check-input me-3" type="checkbox" 
               hx-post="{% url 'tasks:task-toggle' task.id %}" 
               hx-target="#task-{{ task.id }}" 
               hx-swap="outerHTML"
               {% if task.is_done %}checked{% endif %}>
        
        <span class="{% if task.is_done %}text-decoration-line-through text-muted{% endif %}">
            {{ task.name }}
        </span>
    </div>
    
    <div class="d-flex align-items-center">
        {% if task.deadline %}
            <small class="me-3 text-muted"><i class="bi bi-calendar"></i> {{ task.deadline|date:"d M Y" }}</small>
        {% endif %}
        <div class="btn-group btn-group-sm">
            <button hx-get="{% url 'tasks:task-edit' task.id %}" 
                    hx-target="#task-{{ task.id }}" 
                    hx-swap="outerHTML" 
                    class="btn btn-outline-primary border-0">
                <i class="bi bi-pencil"></i>
            </button>
            <button hx-delete="{% url 'tasks:task-delete' task.id %}" 
                    hx-target="#task-{{ task.id }}" 
                    hx-swap="outerHTML"
                    hx-confirm="Are you sure you want to delete this task?"
                    class="btn btn-outline-danger border-0">
                <i class="bi bi-trash"></i>
            </button>
        </div>
    </div>
</div>
