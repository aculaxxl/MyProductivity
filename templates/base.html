<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>{% block title %}MyProductivity{% endblock %}</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600;700&display=swap" rel="stylesheet">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css">
    <style>
        body {
            background: linear-gradient(135deg, #f6d365 0%, #fda085 100%) no-repeat center center fixed;
            background-size: cover;
            font-family: Arial, sans-serif;
            min-height: 100vh;
        }
        .project-container {
            border: 1px solid #1e3a5f;
            border-radius: 8px;
            overflow: hidden;
            box-shadow: 0 10px 25px rgba(0,0,0,0.2);
        }
        .project-header {
            background: linear-gradient(to bottom, #4c77b3 0%, #2d558e 100%);
            color: white;
            padding: 12px 15px;
            border-bottom: 1px solid #1e3a5f;
        }
        .task-create-area {
            background-color: #d1d1d1;
            padding: 10px 15px;
            border-bottom: 1px solid #999;
            box-shadow: inset 0 2px 5px rgba(0,0,0,0.15);
        }
        .btn-add-task {
            background: linear-gradient(to bottom, #74b373 0%, #5a8e59 100%);
            border: 1px solid #4a7549;
            color: white;
            font-weight: bold;
            text-shadow: 1px 1px 1px rgba(0,0,0,0.3);
        }
        .btn-add-task:hover { background: #4a7549; color: white; }
        .task-row {
            background: white;
            border-bottom: 1px solid #eee;
            padding: 10px 15px;
            transition: background 0.2s;
        }
        .task-row:hover {
            background-color: #fff9d7 !important; 
        }
        .task-actions { opacity: 0; transition: opacity 0.2s; }
        .task-row:hover .task-actions { opacity: 1; }
        .task-create-area input, 

        </style>

</head>
<body hx-headers='{"X-CSRFToken": "{{ csrf_token }}"}'>
    <div class="htmx-indicator progress position-fixed top-0 start-0 w-100" style="height: 3px; z-index: 2000;">
        <div class="progress-bar progress-bar-striped progress-bar-animated" style="width: 100%"></div>
    </div>
    <nav class="navbar navbar-expand-lg navbar-dark bg-dark mb-4">
        <div class="container">
            <a class="navbar-brand" href="/">MyProductivity</a>
            <div class="navbar-nav ms-auto">
                {% if user.is_authenticated %}
                    <span class="nav-link text-light">Hello, {{ user.email }}</span>
                    <form method="post" action="{% url 'account_logout' %}" style="display:inline;">
                        {% csrf_token %}
                        <button type="submit" class="btn btn-link nav-link">Logout</button>
                    </form>
                {% else %}
                    <a class="nav-link" href="{% url 'account_login' %}">Login</a>
                {% endif %}
            </div>
        </div>
    </nav>

    <main class="container">
        {% block content %}
        {% endblock %}
    </main>
    <script src="https://cdn.jsdelivr.net/npm/sortablejs@1.15.0/Sortable.min.js"></script>
    <script src="https://unpkg.com/htmx.org@2.0.0"></script>
    <script src="https://unpkg.com/hyperscript.org@0.9.12"></script>
    <script defer src="https://cdn.jsdelivr.net/npm/alpinejs@3.x.x/dist/cdn.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
    {% block extra_js %}{% endblock %}
</body>
</html>
