{% extends "base.html" %}

{% block content %}
<div class="row justify-content-center mt-5">
    <div class="col-md-5">
        <div class="card shadow-sm border">
            <div class="card-header bg-light py-3 text-center">
                <h4 class="mb-0 fw-bold text-dark">Create Account</h4>
            </div>
            <div class="card-body p-4">
                <form method="POST" action="{% url 'account_signup' %}">
                    {% csrf_token %}
                    
                    {% for field in form %}
                        <div class="mb-3">
                            <label class="form-label small fw-bold text-muted">{{ field.label }}</label>
                            {{ field }}
                            {% if field.help_text %}
                                <div class="form-text small text-muted">{{ field.help_text }}</div>
                            {% endif %}
                            {% if field.errors %}
                                <div class="text-danger small mt-1">{{ field.errors.0 }}</div>
                            {% endif %}
                        </div>
                    {% endfor %}

                    <button class="btn btn-primary w-100 py-2 mt-3 shadow-sm" type="submit">
                        <i class="bi bi-person-plus me-1"></i> Register
                    </button>
                </form>
                
                <hr class="my-4">
                <div class="text-center">
                    <p class="small text-muted mb-0">Already have an account?</p>
                    <a href="{% url 'account_login' %}" class="fw-bold text-decoration-none">Sign In Here</a>
                </div>
            </div>
        </div>
    </div>
</div>

<style>
    form input {
        display: block;
        width: 100%;
        padding: 0.5rem 0.75rem;
        font-size: 1rem;
        border: 1px solid #ced4da;
        border-radius: 0.375rem;
        transition: border-color .15s ease-in-out;
    }
    form input:focus {
        border-color: #0d6efd;
        outline: 0;
        box-shadow: 0 0 0 0.25rem rgba(13,110,253,.25);
    }
</style>
{% endblock %}
