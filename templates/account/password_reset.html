{% extends "base.html" %}

{% block content %}
<div class="row justify-content-center mt-5">
    <div class="col-md-5">
        <div class="card shadow-sm border">
            <div class="card-header bg-light py-3 text-center">
                <h4 class="mb-0 fw-bold text-dark">Password Reset</h4>
            </div>
            <div class="card-body p-4">
                <p class="text-muted small text-center mb-4">
                    Enter your e-mail address below, and we'll send you a link to reset your password.
                </p>
                
                <form method="POST" action="{% url 'account_reset_password' %}">
                    {% csrf_token %}
                    
                    <div class="mb-3">
                        <label class="form-label small fw-bold text-muted">E-mail address</label>
                        {{ form.email }} 
                        {% if form.email.errors %}
                            <div class="text-danger small mt-1">{{ form.email.errors.0 }}</div>
                        {% endif %}
                    </div>

                    <button class="btn btn-primary w-100 py-2 shadow-sm" type="submit">
                        Reset My Password
                    </button>
                </form>
            </div>
        </div>
    </div>
</div>

<style>
    form input[type="email"], 
    form input[name="email"] {
        display: block;
        width: 100%;
        padding: 0.5rem 0.75rem;
        font-size: 1rem;
        border: 1px solid #ced4da;
        border-radius: 0.375rem;
    }
</style>
{% endblock %}
